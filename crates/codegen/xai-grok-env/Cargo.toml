[package]
license = "Apache-2.0"
name = "xai-grok-env"
version = "0.1.0"
edition.workspace = true
description = "Backend environment presets for the Grok CLI crate family: endpoint URL defaults and env-var test support."

[features]
# Public Cargo test-support seam; non-default and inert until a test calls it.
test-support = []
# Compatibility alias for the upstream shared-rlib/Bazel convention.
default-bazel = ["test-support"]

[dependencies]
tracing = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
